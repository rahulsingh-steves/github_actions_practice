<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GitHub Actions Practice</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
    }

    header {
      background: #24292e;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .container {
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      text-align: center;
    }

    .card h3 {
      margin-bottom: 10px;
    }

    .card button {
      background: #2da44e;
      border: none;
      padding: 10px 16px;
      color: white;
      border-radius: 6px;
      cursor: pointer;
    }

    .card button:hover {
      background: #218639;
    }

    .logs {
      margin-top: 30px;
      background: #000;
      color: #00ff7f;
      padding: 15px;
      border-radius: 8px;
      height: 200px;
      overflow-y: auto;
      font-size: 14px;
    }
  </style>
</head>
<body>

<header>
  <h1>GitHub Actions Practice Lab</h1>
  <p>Basic HTML + CSS Frontend</p>
</header>

<div class="container">
  <div class="cards">
    <div class="card">
      <h3>Build</h3>
      <p>Run build workflow</p>
      <button onclick="addLog('Build started')">Run Build</button>
    </div>

    <div class="card">
      <h3>Test</h3>
      <p>Run test workflow</p>
      <button onclick="addLog('Tests started')">Run Test</button>
    </div>

    <div class="card">
      <h3>Deploy</h3>
      <p>Run deploy workflow</p>
      <button onclick="addLog('Deploy started')">Run Deploy</button>
    </div>
  </div>

  <div class="logs" id="logs">
    Waiting for workflow...
  </div>
</div>

<script>
  function addLog(message) {
    const logBox = document.getElementById("logs");
    const time = new Date().toLocaleTimeString();
    logBox.innerHTML += `<div>${time} - ${message}</div>`;
    logBox.scrollTop = logBox.scrollHeight;
  }
</script>

</body>
</html>
